<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>병의원-약국 매핑 · 거래처 현황</title>

<!-- 사내용 내부 도구. 검색엔진에 올라갈 이유가 없다. -->
<meta name="robots" content="noindex, nofollow">

<!--
  이 페이지가 하는 일은 하나뿐이다 — 짧은 주소를 앱 주소로 넘겨준다.

  왜 넘기기만 하나
    앱은 Google Apps Script 웹앱이고 주소가 길고 외우기 어렵다
    (/macros/s/AKfycby-... 뒤로 70자가 넘는다). 사람에게 전달하거나
    즐겨찾기에 두려면 짧은 주소가 필요하다. 그 역할만 한다.
    전에는 설명이 붙은 입구 페이지를 두고 '열기'를 누르게 했는데,
    주소 하나로 바로 들어가는 것이 목적이었으므로 한 단계를 뺐다.

  왜 세 가지 방법을 겹쳐 쓰나
    · meta refresh : 자바스크립트가 막혀 있어도 넘어간다
    · location.replace : 즉시 넘어가고 **뒤로 가기가 망가지지 않는다**.
      replace 가 아니라 href 를 쓰면 이 페이지가 기록에 남아,
      앱에서 뒤로 가기를 누를 때마다 다시 앱으로 튕긴다.
    · 보이는 링크 : 둘 다 실패해도 손으로 누를 수 있게

  로그인은 앱이 받는다. 허용명단에 등록된 회사 메일주소와 사번이 둘 다 맞아야
  들어갈 수 있으므로, 이 주소가 공개되어 있어도 데이터는 열리지 않는다.
  앱의 로그인을 끄면 이 저장소도 비공개로 돌려야 한다.
-->
<meta http-equiv="refresh"
      content="0; url=https://script.google.com/macros/s/AKfycby-LfbWZdcAAPOYqnJEENx7qfSx75DSR-sGt2-sxk0s5o2sK_5lPjB5uttkk9g_46td/exec">

<style>
  :root { --navy: #1B2F55; --text-muted: #5C6475; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont,
                 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .msg { font-size: 14px; line-height: 1.8; opacity: 0.9; }
  .msg a { color: #fff; }
</style>
</head>
<body>

<p class="msg">
  거래처 현황 시스템으로 이동 중입니다…<br>
  넘어가지 않으면
  <a id="go"
     href="https://script.google.com/macros/s/AKfycby-LfbWZdcAAPOYqnJEENx7qfSx75DSR-sGt2-sxk0s5o2sK_5lPjB5uttkk9g_46td/exec">여기를
  눌러 주세요</a>.
</p>

<script>
  // replace 를 쓰는 이유는 위 주석 참고 — 뒤로 가기가 이 페이지에 걸리지 않게.
  location.replace(document.getElementById('go').href);
</script>

</body>
</html>
